name: Deploy to GitHub Pages

on:
  push:
    branches: [main]          # redeploy when the code changes
  schedule:
    - cron: '7,22,37,52 * * * *'   # refresh ~every 15 min at off-peak minutes (GitHub cron is best-effort; over-schedule so delays/drops hurt less)
  workflow_dispatch:           # allow manual runs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble site + fetch fresh prices
        run: |
          mkdir -p _site/json
          cp index.html app.js styles.css _site/
          node scripts/update-data.js _site/json poe1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
